﻿<!DOCTYPE html>
<head>
    <title>Đăng nhập</title>
    <meta charset="utf-8"/>
    <link rel="stylesheet" href="/Core/v2.1/style/css/login/login.min.css?v=1">
    <script src="/Core/v2.1/style/js/lib/jquery.min.js"></script>
    <script>
        (function($) {
            $(document).ready(function() {
                $("input[type=checkbox],input[type=radio]")
                        .each(function() {
                    var id = $(this).attr('id') ? $(this).attr('id') : 'check-20550420416ac74e8490976';
                    $(this).hide().attr('id', id)
                            .after("<label class='check' for='" + id + "'><span></span></label>");
                });

                $("a.update").click(function(event) {
                    alert("Thông tin đang cập nhật");
                    event.preventDefault();
                });
            });
        })(jQuery);
    </script>    
</head>
<body>
    <div class="wrap">
        <div class="main">
            <div class="left" >
                <img src="/Core/v2.1/style/css/login/flight.png"/>
                <div class="caption">
                    <h1>Không chỉ là một giải pháp quản lý</h1>
                    <span>Làm việc mọi lúc mọi nơi</span>
                </div>
            </div>
            <div class="right">
                <div class="form">
    <form action="/Login" method="post">
                            <div class="error">Bạn chưa nhập mật khẩu</div>
                            <input placeholder="Tên đăng nhập" type="text" name="username"/>
        <input placeholder="Mật khẩu" type="password" name="userpwd"/>
        <label for="persistent">
            <input type="checkbox" id="persistent" name="persistent" value="1"/>
            Giữ tôi luôn đăng nhập        </label>
        <a href="https://accounts.google.com/o/oauth2/auth?response_type=code&access_type=online&client_id=937307102473-cds1qlqhsp9fjrg953oa399trpbk4efv.apps.googleusercontent.com&redirect_uri=http%3A%2F%2Fvanphongdientu.utc.edu.vn%2FLogin&state&scope=https%3A%2F%2Fwww.googleapis.com%2Fauth%2Fplus.login%20https%3A%2F%2Fwww.googleapis.com%2Fauth%2Fuserinfo.email%20https%3A%2F%2Fwww.googleapis.com%2Fauth%2Fuserinfo.profile%20https%3A%2F%2Fwww.googleapis.com%2Fauth%2Fplus.me&approval_prompt=auto" class="button">Đăng nhập bằng e-mail UTC</a>
        <input type="submit" value="Đăng nhập" class="submit_login"/>
    </form>
</div>
<div class="helps">
    <a href="/Login/GetPass">
        Bạn quên mật khẩu đăng nhập ?    </a>
</div>            </div>
        </div>
        <div class="footer">
            <div class="left">
                <span class="a">Trường ĐH Giao Thông Vận Tải &copy; 2026</span>
            </div>
            <div class="right">
                <a href="http://hotrokythuat.utc.edu.vn" target="_blank" class="a">Trung tâm trợ giúp</a>
                <a href="mailto:hotrokythuat@utc.edu.vn" class="a">Ý kiến phản hồi</a>
            </div>
        </div>
    </div>
</body>
</html>
